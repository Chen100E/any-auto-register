name: Docker Hub

# 只做两件事：在 GitHub runner 上构建镜像，推到 Docker Hub。
# 不在任何本地/沙箱环境构建。

on:
  push:
    branches:
      - main
      - feat/cfsolve-moonmath
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建平台（默认 linux/amd64；多架构写 linux/amd64,linux/arm64，会慢很多）"
        required: false
        default: "linux/amd64"

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: baiyichen/any-auto-register

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/cfsolve-moonmath' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "平台: \`${{ inputs.platforms || 'linux/amd64' }}\`"
            echo "提交: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
