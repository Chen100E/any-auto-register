name: Docker Hub

# 在 GitHub runner 上构建 amd64 + arm64（都用原生 runner，不走 QEMU 模拟），
# 最后合并成多架构 manifest 推到 Docker Hub。不在任何本地/沙箱环境构建。

on:
  push:
    branches:
      - main
      - feat/cfsolve-moonmath
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: baiyichen/any-auto-register

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 守卫：构建上下文里不许有数据库或凭据
        run: |
          set -euo pipefail
          # 用一份探针 Dockerfile 真实走一遍 COPY . /ctx，
          # .dockerignore 的语义跟正式构建完全一致，比 grep 可靠。
          printf 'FROM alpine:3.20\nCOPY . /ctx\n' > /tmp/ctx.Dockerfile
          docker build -f /tmp/ctx.Dockerfile -t ctx-probe . > /dev/null
          PATTERNS="-name '*.db' -o -name '*.db-journal' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'results.jsonl' -o -name '.gh_token' -o -name '.askpass' -o -name '.deploy_secrets'"
          echo "== 上下文里的可疑文件 =="
          docker run --rm ctx-probe sh -c "find /ctx -type f \( $PATTERNS \) -print" | tee /tmp/bad.txt
          if [ -s /tmp/bad.txt ]; then
            echo "::error::构建上下文里混进了数据库/凭据，已停止构建（检查 .dockerignore）"
            exit 1
          fi
          echo "✓ 上下文干净：没有 .db / .env / 密钥 / 账号导出"

  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/cfsolve-moonmath' }}

  build:
    needs: [guard, meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 给每个 tag 加架构后缀
        id: tags
        env:
          META_TAGS: ${{ needs.meta.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          out=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            out="${out}${t}-${ARCH}"$'\n'
          done <<< "$META_TAGS"
          {
            echo "tags<<__EOF__"
            printf '%s' "$out"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          printf '本架构 tags:\n%s\n' "$out"

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ needs.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false

  merge:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 合并多架构 manifest
        env:
          META_TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "::group::$tag"
            docker buildx imagetools create \
              -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
            docker buildx imagetools inspect "$tag"
            echo "::endgroup::"
          done <<< "$META_TAGS"

      - name: Summary
        run: |
          {
            echo "### 镜像已推送（amd64 + arm64）"
            echo ""
            echo '```'
            echo "${{ needs.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "提交: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
